name: Build Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["source/start.py", "source/mac/**", ".github/workflows/build-mac.yml"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14   # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller pyserial pillow

      - name: Assemble the app files
        run: |
          set -e
          mkdir -p work/app
          cp app/* work/app/
          VERSION=$(python -c "import json;print(json.load(open('release.json'))['version'])")
          echo "VERSION = \"$VERSION\"" > work/app/version.py
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp source/start.py work/start.py

      - name: Build with PyInstaller
        working-directory: work
        run: |
          set -e
          EXCL=""
          for m in car_code_reader obd_core dtc_database icons icon_render vehicles version updater j1939 obd1 maker_codes recalls service_guides advanced history report; do
            EXCL="$EXCL --exclude-module $m"
          done
          python -m PyInstaller --noconfirm --clean --windowed \
            --name "Car Code Reader" \
            --icon ../source/mac/AppIcon.icns \
            --osx-bundle-identifier local.carcodereader \
            --add-data "app:app" $EXCL start.py

      - name: Finish the app bundle
        working-directory: work
        run: |
          set -e
          APP="dist/Car Code Reader.app"
          PL="$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$PL"
          plutil -replace CFBundleVersion -string "$VERSION" "$PL"
          plutil -replace LSMinimumSystemVersion -string "11.0" "$PL"
          plutil -replace NSBluetoothAlwaysUsageDescription -string "Car Code Reader talks to Bluetooth OBD-II adapters." "$PL"
          plutil -replace NSLocalNetworkUsageDescription -string "Car Code Reader talks to Wi-Fi OBD-II adapters." "$PL"
          if [ -n "$MACOS_CERT_P12_BASE64" ]; then
            echo "Developer ID certificate found — signing and notarizing so it opens on any Mac."
            # 1. Put the certificate into a temporary keychain
            KEYCHAIN="$RUNNER_TEMP/ccr.keychain-db"
            KCPASS="$(uuidgen)"
            security create-keychain -p "$KCPASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
            echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
            echo "Signing identity: $IDENTITY"
            # 2. Sign with the hardened runtime + entitlements (required for notarization)
            codesign --force --deep --options runtime --timestamp \
              --entitlements ../source/mac/entitlements.plist \
              --sign "$IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            # 3. Notarize with Apple, then staple the ticket into the app
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$APP"
            echo "NOTARIZED=1" >> "$GITHUB_ENV"
          else
            echo "No Developer ID certificate secret set — using ad-hoc signing (opens only with the manual workaround on other Macs)."
            codesign --force --deep -s - "$APP"
            codesign --verify --deep --strict "$APP"
          fi
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Self-test (no Python on the path)
        working-directory: work
        run: |
          set -e
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          env -i HOME="$HOME" PATH=/usr/bin:/bin "dist/Car Code Reader.app/Contents/MacOS/Car Code Reader" --selftest
          env -i HOME="$HOME" PATH=/usr/bin:/bin "dist/Car Code Reader.app/Contents/MacOS/Car Code Reader" --version
          file "dist/Car Code Reader.app/Contents/MacOS/Car Code Reader"

      - name: Make the DMG
        working-directory: work
        run: |
          set -e
          mkdir dmg
          cp -R "dist/Car Code Reader.app" dmg/
          ln -s /Applications dmg/Applications
          cp ../source/mac/Install.txt "dmg/How to install.txt"
          cp "../source/mac/Open Car Code Reader.command" "dmg/Open Car Code Reader.command"
          chmod +x "dmg/Open Car Code Reader.command"
          hdiutil create -volname "Car Code Reader" -srcfolder dmg -ov -format UDZO Car-Code-Reader.dmg
          hdiutil verify Car-Code-Reader.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Car-Code-Reader-dmg
          path: work/Car-Code-Reader.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="mac-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" work/Car-Code-Reader.dmg --clobber
          else
            gh release create "$TAG" work/Car-Code-Reader.dmg --latest \
              --title "Car Code Reader $VERSION for Mac" \
              --notes "Stand-alone Mac app: Python is built in. Download Car-Code-Reader.dmg, drag the app to Applications, then use Open Anyway once (System Settings > Privacy & Security)."
          fi
